[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-ticket-agent"
version = "0.1.0"
description = "Smart ticket multi-agent system with benchmark and evaluation platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Agent Pro" },
]

dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
llm = [
    "openai>=1.40,<2",
    "deepeval>=1.0,<3",
]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<1",
]

[project.scripts]
ticket-agent = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: unit level tests",
    "integration: integration level tests",
    "e2e: end-to-end tests",
    "security: security resistance tests",
    "regression: regression tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["app", "benchmark"]

[tool.coverage.report]
show_missing = true
skip_covered = true
